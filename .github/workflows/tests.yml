name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'numpy>=1.24,<2' 'scipy>=1.10' 'soundfile>=0.12' 'fastapi>=0.115,<1' 'python-multipart>=0.0.18' 'httpx>=0.27,<1' 'pytest>=8' 'sacrebleu>=2.4,<3' 'jiwer>=3,<5'
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: node --check src/speech_translate/web/app.js
      - run: node --test tests/test_recorder.cjs
